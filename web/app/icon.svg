<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050E1E"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>
    <linearGradient id="dropFill" x1="9" y1="4" x2="23" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#082840" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#050F22" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="gc" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.0" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dropClip">
      <path d="M 16 4 C 16 4.5,22.3 10.6,22.3 17.3 A 6.3 6.3 0 0 1 9.7 17.3 C 9.7 10.6,16 4,16 4 Z"/>
    </clipPath>
    <clipPath id="ios">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ios)">
    <rect width="32" height="32" fill="url(#bg)"/>

    <!-- Ambient glow -->
    <ellipse cx="16" cy="15" rx="10" ry="11" fill="#0080C0" opacity="0.30"/>

    <!-- Left chat bubble -->
    <g filter="url(#gc)">
      <path d="M 3.2 3.2 L 11 3.2 Q 12 3.2 12 4.2 L 12 8.8 Q 12 9.8 11 9.8 L 9.8 9.8 L 8.8 11.4 L 7.8 9.8 L 3.2 9.8 Q 2.2 9.8 2.2 8.8 L 2.2 4.2 Q 2.2 3.2 3.2 3.2 Z"
            fill="rgba(0,40,90,0.15)" stroke="#00CCFF" stroke-width="0.55" stroke-linejoin="round"/>
      <line x1="3.4" y1="5.3" x2="10.8" y2="5.3" stroke="#00CCFF" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
      <line x1="3.4" y1="6.5" x2="9.6" y2="6.5" stroke="#00CCFF" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
      <line x1="3.4" y1="7.7" x2="10.2" y2="7.7" stroke="#00CCFF" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- Drop fill -->
    <path d="M 16 4 C 16 4.5,22.3 10.6,22.3 17.3 A 6.3 6.3 0 0 1 9.7 17.3 C 9.7 10.6,16 4,16 4 Z"
          fill="url(#dropFill)"/>

    <!-- Circuit inside drop -->
    <g clip-path="url(#dropClip)" filter="url(#gg)">
      <line x1="16" y1="23.2" x2="16" y2="10.8" stroke="#00FF88" stroke-width="0.55"/>
      <polyline points="16,20.8 13.7,20.8 13.7,18.8" stroke="#00FF88" stroke-width="0.45" fill="none"/>
      <polyline points="16,20.8 18.3,20.8 18.3,18.6" stroke="#00FF88" stroke-width="0.45" fill="none"/>
      <polyline points="16,18.2 14.2,18.2 14.2,16.8" stroke="#00FF88" stroke-width="0.42" fill="none"/>
      <polyline points="16,18.2 17.8,18.2 17.8,16.6 17,16.6" stroke="#00FF88" stroke-width="0.42" fill="none"/>
      <polyline points="16,15.3 14.3,15.3 14.3,13.7" stroke="#00FF88" stroke-width="0.40" fill="none"/>
      <polyline points="16,15.3 17.8,15.3 17.8,13.5" stroke="#00FF88" stroke-width="0.40" fill="none"/>
      <circle cx="16"   cy="20.8" r="0.55" fill="#00FF88"/>
      <circle cx="16"   cy="18.2" r="0.55" fill="#00FF88"/>
      <circle cx="16"   cy="15.3" r="0.55" fill="#00FF88"/>
      <circle cx="13.7" cy="20.8" r="0.42" fill="#00FF88"/>
      <circle cx="18.3" cy="20.8" r="0.42" fill="#00FF88"/>
      <circle cx="14.2" cy="18.2" r="0.42" fill="#00FF88"/>
      <circle cx="17.8" cy="18.2" r="0.42" fill="#00FF88"/>
    </g>

    <!-- Drop outline -->
    <path d="M 16 4 C 16 4.5,22.3 10.6,22.3 17.3 A 6.3 6.3 0 0 1 9.7 17.3 C 9.7 10.6,16 4,16 4 Z"
          fill="none" stroke="#00D4FF" stroke-width="0.7" filter="url(#gc)"/>

    <!-- Tip glow dot -->
    <circle cx="16" cy="4" r="0.7" fill="#00D4FF" filter="url(#gc)"/>

    <!-- Right chat bubble -->
    <g filter="url(#gc)">
      <path d="M 20 12.8 L 29 12.8 Q 30 12.8 30 13.8 L 30 18.4 Q 30 19.4 29 19.4 L 24.2 19.4 L 23.2 21 L 22.2 19.4 L 20 19.4 Q 19 19.4 19 18.4 L 19 13.8 Q 19 12.8 20 12.8 Z"
            fill="rgba(0,40,90,0.15)" stroke="#00CCFF" stroke-width="0.55" stroke-linejoin="round"/>
      <line x1="20.2" y1="14.9" x2="29.8" y2="14.9" stroke="#00CCFF" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
      <line x1="20.2" y1="16.1" x2="28.6" y2="16.1" stroke="#00CCFF" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
      <line x1="20.2" y1="17.3" x2="29.2" y2="17.3" stroke="#00CCFF" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>
</svg>
