<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050E1E"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>
    <linearGradient id="dropFill" x1="9.7" y1="5" x2="22.3" y2="23.6" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#082840" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#050F22" stop-opacity="0.97"/>
    </linearGradient>
    <filter id="gc" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="drop">
      <path d="M 16 4.8 C 16 5.4,22.3 10.6,22.3 17.3 A 6.3 6.3 0 0 1 9.7 17.3 C 9.7 10.6,16 5.4,16 4.8 Z"/>
    </clipPath>
    <clipPath id="ios"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>

  <g clip-path="url(#ios)">
    <!-- Background -->
    <rect width="32" height="32" fill="url(#bg)"/>

    <!-- Ambient glow -->
    <ellipse cx="16" cy="16" rx="10" ry="12" fill="#0284C7" opacity="0.22"/>

    <!-- Drop fill -->
    <path d="M 16 4.8 C 16 5.4,22.3 10.6,22.3 17.3 A 6.3 6.3 0 0 1 9.7 17.3 C 9.7 10.6,16 5.4,16 4.8 Z"
          fill="url(#dropFill)"/>

    <!-- Circuit spine (readable green line through center) -->
    <g clip-path="url(#drop)" filter="url(#gg)">
      <line x1="16" y1="23" x2="16" y2="10.5" stroke="#00FF88" stroke-width="0.9"/>
      <!-- Two branch pairs -->
      <polyline points="16,20 13.4,20 13.4,17.8" stroke="#00FF88" stroke-width="0.7" fill="none"/>
      <polyline points="16,20 18.6,20 18.6,17.8" stroke="#00FF88" stroke-width="0.7" fill="none"/>
      <polyline points="16,16.5 14,16.5 14,14.5" stroke="#00FF88" stroke-width="0.65" fill="none"/>
      <polyline points="16,16.5 18,16.5 18,14.3" stroke="#00FF88" stroke-width="0.65" fill="none"/>
      <!-- Junction dots -->
      <circle cx="16"   cy="20"   r="0.65" fill="#00FF88"/>
      <circle cx="16"   cy="16.5" r="0.65" fill="#00FF88"/>
      <circle cx="13.4" cy="20"   r="0.48" fill="#00FF88"/>
      <circle cx="18.6" cy="20"   r="0.48" fill="#00FF88"/>
      <circle cx="14"   cy="16.5" r="0.48" fill="#00FF88"/>
      <circle cx="18"   cy="16.5" r="0.48" fill="#00FF88"/>
    </g>

    <!-- Drop outline (neon cyan glow) -->
    <path d="M 16 4.8 C 16 5.4,22.3 10.6,22.3 17.3 A 6.3 6.3 0 0 1 9.7 17.3 C 9.7 10.6,16 5.4,16 4.8 Z"
          fill="none" stroke="#00D4FF" stroke-width="0.85" filter="url(#gc)"/>

    <!-- Tip glow dot -->
    <circle cx="16" cy="4.8" r="0.9" fill="#00D4FF" filter="url(#gc)"/>

    <!-- Refraction highlight -->
    <path d="M 16 5.5 C 15.2 7.5,13.2 11.5,12.8 15.8"
          fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
